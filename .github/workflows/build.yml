name: Build & Release

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 8
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle wrapper
        uses: actions/cache@v4.2.3
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle caches
        uses: actions/cache@v4.2.3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Write firebase.properties
        run: |
          printf 'firebase.url=%s\nfirebase.secret=%s\ngithub.token=%s\ngithub.repo=%s\n' \
            '${{ secrets.FIREBASE_URL }}' \
            '${{ secrets.FIREBASE_SECRET }}' \
            '${{ secrets.GH_PAT }}' \
            '${{ secrets.GITHUB_REPO }}' \
            > src/main/resources/firebase.properties

      - name: Setup ForgeGradle workspace
        run: ./gradlew setupCIWorkspace

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E '^version\s*=' build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: build/libs/*.jar
          fail_on_unmatched_files: true
